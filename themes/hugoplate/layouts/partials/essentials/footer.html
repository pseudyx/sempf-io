<footer class="bg-theme-light dark:bg-darkmode-theme-light">
  <div class="container">
    <div class="row items-center py-10">
      <div class="lg:col-3 mb-8 text-center lg:mb-0 lg:text-left">
        <!-- navbar brand/logo -->
        <a
          class="navbar-brand inline-block"
          href="{{ site.Home.RelPermalink }}">
          {{ partial "logo" }}
        </a>
      </div>
      <div class="lg:col-6 mb-8 text-center lg:mb-0">
        <ul>
          {{ range site.Menus.footer }}
            <li class="m-3 inline-block">
              <a
                {{ if findRE `^http` .URL }}
                  target="_blank" rel="noopener"
                {{ end }}
                href="{{ if findRE `^#` .URL }}
                  {{ if not $.IsHome }}
                    {{ site.Home.RelPermalink }}
                  {{ end }}{{ .URL }}
                {{ else }}
                  {{ .URL | relLangURL }}
                {{ end }}"
                >{{ .Name }}</a
              >
            </li>
          {{ end }}
        </ul>
      </div>
      <div class="lg:col-3 mb-8 text-center lg:mb-0 lg:mt-0 lg:text-right">
        <ul class="social-icons">
          {{ range site.Data.social.main }}
            <li class="align-middle">
              <a
                target="_blank"
                aria-label="{{ .name }}"
                rel="nofollow noopener"
                href="{{ .link | safeURL }}">
                {{ if eq .name "substack" }}
                  {{ $image := resources.Get .icon }}
                  {{ $imageDark := resources.Get (replace .icon ".png" "-dark.png") }}
                  <img src="{{ $image.RelPermalink }}" class="max-w-full max-h-full dark:hidden" />
                  <img src="{{ $imageDark.RelPermalink }}" class="max-w-full max-h-full hidden dark:block" />
                {{ else }}
                  <i class="{{ .icon }}"></i>
                {{ end }}
              </a>
            </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
</footer>
