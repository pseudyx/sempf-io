<a href="{{ .Params.link }}" 
  class="bg-body dark:bg-darkmode-body flex gap-4 items-start hover:opacity-80 transition-opacity"
  target="_blank">
  <div class="flex-1">
    <h5 class="mb-3">
      {{ .Title }}
    </h5>
    <p class="mb-2">
      {{ $description:= .Params.description }}
      {{ if $description }}
        {{ $description }}
      {{ end }}
    </p>
  </div>
  {{ $image:= .Params.image }}
  {{ if $image }}
    <div class="flex-shrink-0 w-32 h-32">
      {{ partial "image" (dict "Src" $image "Context" .Page "Alt" .Title "Class" "w-full h-full object-cover rounded") }}
    </div>
  {{ end }}
</a>
