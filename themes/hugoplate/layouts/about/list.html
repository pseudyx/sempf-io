{{ define "main" }}
{{ partial "page-header" . }}

  <section class="pt-8 pb-16">
    <div class="container">
      <div class="row justify-center">
        <div class="md:col-10 lg:col-7 text-left">
          <div class="content">{{ .Content }}</div>
          {{ with .Params.second_section }}
          <hr class="my-8" />
          <div class="content prose dark:prose-invert">
            {{ . | markdownify }}
          </div>
          {{ end }}
        </div>
      </div>
    </div>
  </section>

{{ partial "page-footer" . }}
{{ end }}
